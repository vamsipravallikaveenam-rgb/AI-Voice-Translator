<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Translator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* IMAGE BACKGROUND LINK */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://www.shutterstock.com/image-illustration/ai-deep-fake-voice-translate-260nw-2567982953.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent */
            backdrop-filter: blur(15px); /* Frosted glass effect */
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 450px;
            color: white;
            text-align: center;
        }

        h2 { margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; }

        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        button {
            background: #00d2ff; /* Bright Cyan */
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
        }

        button:active { transform: translateY(0); }

        button:disabled { background: #888; cursor: not-allowed; }

        .label {
            display: block;
            text-align: left;
            margin-top: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ddd;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            min-height: 50px;
            margin-top: 8px;
            border-radius: 12px;
            text-align: left;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>AI Translator</h2>
        
        <select id="langSelect">
            <option value="es">Spanish (Español)</option>
            <option value="fr">French (Français)</option>
            <option value="de">German (Deutsch)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="ja">Japanese (日本語)</option>
            <option value="ar">Arabic (العربية)</option>
        </select>

        <button id="startBtn">🎤 Tap to Speak</button>

        <span class="label">Detected Speech:</span>
        <div id="originalText" class="box">---</div>

        <span class="label">Translation:</span>
        <div id="translatedText" class="box" style="color: #00d2ff;">---</div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const originalDiv = document.getElementById('originalText');
        const translatedDiv = document.getElementById('translatedText');
        const langSelect = document.getElementById('langSelect');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Your browser does not support Speech Recognition. Please use Chrome.");
        } else {
            const recognition = new SpeechRecognition();

            recognition.onstart = () => {
                startBtn.innerText = "Listening...";
                startBtn.disabled = true;
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                originalDiv.innerText = transcript;

                const targetLang = langSelect.value;
                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=en|${targetLang}`);
                    const data = await response.json();
                    const translatedText = data.responseData.translatedText;
                    translatedDiv.innerText = translatedText;

                    const utterance = new SpeechSynthesisUtterance(translatedText);
                    utterance.lang = targetLang;
                    window.speechSynthesis.speak(utterance);
                } catch (err) {
                    translatedDiv.innerText = "Error fetching translation.";
                }

                startBtn.innerText = "🎤 Tap to Speak";
                startBtn.disabled = false;
            };

            recognition.onerror = () => {
                startBtn.innerText = "🎤 Tap to Speak";
                startBtn.disabled = false;
            };

            startBtn.onclick = () => {
                recognition.start();
            };
        }
    </script>
</body>
</html>
